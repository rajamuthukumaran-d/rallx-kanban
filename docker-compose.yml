services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rallx
      POSTGRES_USER: rallx
      POSTGRES_PASSWORD: change-me
    volumes: [rallx-data:/var/lib/postgresql/data]
volumes:
  rallx-data:
